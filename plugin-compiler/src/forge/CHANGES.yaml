# Änderungsprotokoll: Abweichungen des erzeugten dv-forge vom Bestand plugins/forge.
# Der Build vergleicht jede Datei mit dem Bestand. Eine abweichende, neue oder fehlende Datei muss hier unter genau
# den Befunden stehen, die sie ändern; eine gelistete Datei, die nicht (mehr) abweicht, ist ebenfalls ein Fehler.
# Befund-Nummern wie in der Entscheidungsliste (1 bis 12, B, C).
basis: dv-forge 0.34.0 plus fix/forge-handover-stability (7b4faac)
changes:
  - befund: "2"
    titel: Reviewer vergeben Kategorien, die Farbe setzt das Skript
    warum: severity-rules.md und finding-format.md sagten das Gegenteil von Agents und rules.js; der Code gilt.
    dateien:
      - shared/review-loop/severity-rules.md
      - shared/review-loop/finding-format.md
      - tests/review-loop.test.js
  - befund: "3"
    titel: Eine Commit-Form mit Pfaden, git add und commit direkt nacheinander
    warum: git commit -- <pfad> allein scheitert an neuen Dateien; Spec, Plan und Umsetzer schrieben drei verschiedene Formen vor.
    dateien:
      - skills/spec-whiteboarding/references/spec-format.md
      - skills/plan-writing/references/plan-format.md
      - shared/session-chain/base-sub-agent.md
      - agents/implementation-implementer.md
      - scripts/guard-orchestrator.js
      - tests/commit-rule.test.js
      - tests/spec-whiteboarding.test.js
  - befund: "4"
    titel: Fragen in Runden auch im Plan-Writing; Ton-Regel 7 nimmt die Fragerunden aus
    warum: "Entscheidung des Menschen: eine Runde mit allen offenen Fragen lässt sich mit „wie empfohlen“, Einzelkorrektur oder Freitext beantworten."
    dateien:
      - shared/dialog-rules.md
      - skills/plan-writing/SKILL.md
      - tests/plan-writing.test.js
      - tests/dialog-rules.test.js
  - befund: "5"
    titel: Frontmatter ist gültiges YAML; der Compiler quotet Werte, die sonst ungültig wären
    warum: "argument-hint: [grill|…] [pfade] und eine description mit „Triggers: …“ lehnt ein YAML-Parser ab."
    dateien:
      - skills/session-orchestrator/SKILL.md
      - skills/spec-whiteboarding/SKILL.md
      - tests/lib/markdown.js
      - tests/skill.test.js
  - befund: "6"
    titel: Test-Reviewer darf keine Dateien bearbeiten
    warum: Ohne tools-Zeile erbte er auch Edit. Eine tools-Liste schlösse Tool-Aufrufe als Testbefehl aus, deshalb disallowedTools.
    dateien:
      - agents/implementation-review-tests.md
      - tests/implementation-review-agents.test.js
  - befund: "9"
    titel: Überschrift von loop.md ohne den vermiedenen Begriff Review-Loop
    dateien:
      - shared/review-loop/loop.md
      - tests/review-loop.test.js
  - befund: "10"
    titel: Spec-Nachprüfer nutzt die Kategorien der Spec-Reviewer
    warum: Sein detail nannte Randfälle, die die Spec-Reviewer nie melden; unerfuellbar und fehlendes-verhalten wichen ab.
    dateien:
      - agents/spec-review-verifier.md
      - tests/agents.test.js
  - befund: "11"
    titel: Regel 12 des Plan-Formats nennt den Tag Planer der E-Einträge
    dateien:
      - skills/plan-writing/references/plan-format.md
      - tests/plan-writing.test.js
  - befund: "12"
    titel: NEVER in Kleinschreibung
    dateien:
      - skills/commit-message/SKILL.md
  - befund: "B"
    titel: Auch ein 🔴 wird erst ab der Empfehlungs-Schwelle automatisch umgesetzt
    warum: "Entscheidung des Menschen: jedes Finding, egal welche Farbe, nach demselben Verfahren; ein unsicheres 🔴 bleibt beim Menschen statt blind umgesetzt zu werden."
    dateien:
      - scripts/followup.js
      - scripts/orchestrator-state.js
      - scripts/lib/orchestrator-report.js
      - scripts/lib/orchestrator-report-text.js
      - scripts/lib/scout-check.js
      - scripts/lib/report-data.js
      - scripts/lib/implementation-report.js
      - scripts/lib/implementation-followup-report.js
      - agents/spec-review-scout.md
      - agents/plan-review-scout.md
      - agents/implementation-review-scout.md
      - skills/review-followup/SKILL.md
      - shared/orchestrator-rules.md
      - tests/followup.test.js
      - tests/prepare.test.js
      - tests/scout-texts.test.js
      - tests/orchestrator-report.test.js
  - befund: "C"
    titel: Die Spec-Nacharbeit übernimmt den bevorzugten Vorschlag ab der Empfehlungs-Schwelle ohne Rückfrage
    warum: "Entscheidung des Menschen: Rückfragen nach den Reviewer-Runden ab der Schwelle selbst entscheiden. Die Plan-Nacharbeit fragt nur bei Spec-Widersprüchen; die Spec ändert sie nicht, deshalb bleibt sie unverändert."
    dateien:
      - scripts/lib/rework-input.js
      - agents/spec-rework.md
      - tests/review-flow-round-one.test.js
      - tests/agents.test.js
  - befund: "14"
    titel: Vorab-Prüfung vor dem final (previewFinal aus fix/forge-handover-stability verdrahtet)
    warum: Die Funktion war exportiert und getestet, aber kein Skript rief sie auf. Die Etappe sieht jetzt vor ihrem final, woran die Leit-Session halten würde.
    dateien:
      - scripts/session-chain.js
      - shared/session-chain/base-sub-agent.md
      - tests/session-chain-cli.test.js
  - befund: "V"
    titel: Version 0.35.0 für die Befunde 2 bis 12, B und C
    dateien:
      - .claude-plugin/plugin.json

