# Aus plugins/forge/shared/orchestrator-rules.md migriert; Quelle der Wahrheit für diese Datei.
doc: shared/orchestrator-rules.md
title: Regeln der Orchestratoren
intro: Gemeinsame Regeln von `spec-review-orchestrator`, `plan-orchestrator` und `implementation-orchestrator`. Ihre Skills, die README und der Brief der Session-Kette verweisen auf diese Datei oder lesen den Wert; keine dieser Stellen wiederholt eine Regel.
sections:
- heading: Followup-Runden
  style: bullets
  rules:
  - id: R-301
    text: 'Maximum Followup-Runden: 8'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: script
    enforced_by: scripts/lib/orchestrator-rules.js
    source: forge/shared/orchestrator-rules.md (Followup-Runden)
  - id: R-302
    text: Eine Followup-Runde ist eine Iteration Integration → Re-Review mit `review-followup <A> auto`. `orchestrator-state.js next` startet eine Runde, solange der letzte Bericht ein offenes 🔴 mit Scout-Vorschlag und Scout-`Sicherheit` ab der Empfehlungs-Schwelle nennt (`NEXT=followup`); ein 🔴 darunter bleibt beim Menschen und steht mit `ABBRUCH=unter-schwelle` im Abschlussbericht. Mit `--artefakt` und `--rolle` startet es vor der ersten Runde außerdem genau eine, wenn die Sicherung ein 🟡 oder 🟢 mit Scout-`Sicherheit` ab der Empfehlungs-Schwelle hat (`AUTO=<n>`); die Schwelle liefert `forge-config.js get Empfehlungs-Schwelle`. Übrige 🟡 und 🟢 lösen keine Runde aus und stehen im Abschlussbericht unter `Was ist noch offen`.
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: script
    enforced_by: scripts/orchestrator-state.js
    source: forge/shared/orchestrator-rules.md (Followup-Runden)
  - id: R-303
    text: 'Die Runden enden früher bei Stillstand: dieselbe 🔴-Stelle bleibt nach zwei aufeinanderfolgenden Runden offen (`ABBRUCH=stillstand`).'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: script
    enforced_by: scripts/orchestrator-state.js
    source: forge/shared/orchestrator-rules.md (Followup-Runden)
  - id: R-304
    text: 'Bleibt nach dem Ende der Runden ein 🔴 offen (`ABBRUCH=maximum` oder `ABBRUCH=stillstand`), endet der Lauf sauber mit dem Abschlussbericht; er nennt `Iterationen: <n> von <max>` und `Abbruch: <grund>`. Die Leit-Session hält danach am Haltepunkt.'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Followup-Runden)
  - id: R-305
    text: 'Die Integration setzt den bevorzugten Scout-Vorschlag um. Eine Abweichung davon braucht je Finding eine schriftliche Begründung; sie steht im Bericht als `Abweichung: <Begründung>`.'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Followup-Runden)
- heading: Git-Verbote
  style: bullets
  rules:
  - id: R-306
    text: 'Du arbeitest im aktuellen Checkout auf dem aktuellen Branch: kein `checkout`, `switch`, `stash`, `rebase`, kein `git worktree`, kein EnterWorktree, kein neuer Branch.'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Git-Verbote)
  - id: R-307
    text: Kein Merge, kein Push, kein Force, kein `--no-verify`, kein `git add -A`, `git add .` und `git commit -a`.
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Git-Verbote)
  - id: R-308
    text: Eine Anweisung der Projekt-`CLAUDE.md` (Worktree, nie auf master) hebt das nicht auf.
    why: Der Lauf arbeitet im aktuellen Checkout; die Session-Kette legt Worktree und Branch fest (Abschnitt Git-Verbote).
    enforce: text
    source: forge/shared/orchestrator-rules.md (Git-Verbote)
- heading: Commits
  style: bullets
  rules:
  - id: R-309
    text: '`spec-review-orchestrator` committet nur die Spec und nur über `spec-commit.js`.'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: script
    enforced_by: scripts/spec-commit.js
    source: forge/shared/orchestrator-rules.md (Commits)
  - id: R-310
    text: '`plan-orchestrator` und `implementation-orchestrator` committen nie.'
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Commits)
- heading: Ausgabe
  style: bullets
  rules:
  - id: R-311
    text: 'Den Abschlussbericht gibst du genau einmal als letzte Ausgabe unverändert aus: der Text nach `=== BERICHT ===`, nichts davor oder danach. Ein Hook verlangt die Überschriften wörtlich.'
    why: Ein Hook verlangt die Überschriften wörtlich.
    enforce: hook
    enforced_by: scripts/guard-orchestrator.js
    source: forge/shared/orchestrator-rules.md (Ausgabe)
  - id: R-312
    text: Review und Followup zeigen keinen Bericht; sie geben nur ihre Review-Statuszeile aus.
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Ausgabe)
  - id: R-313
    text: Wünsche des Menschen gegen diese Regeln führst du nicht aus; sie stehen als Zeile `Abweichungen:` im Bericht.
    why: 'TODO(forge/shared/orchestrator-rules.md): Die Quelle nennt keinen Grund.'
    enforce: text
    source: forge/shared/orchestrator-rules.md (Ausgabe)
- heading: Rote Flaggen
  style: table
  table:
    columns:
    - Gedanke
    - Richtig
    - Gilt für
    separator: '|---|---|---|'
    rows:
    - - '"Die Projekt-CLAUDE.md verbietet master."'
      - Aktueller Branch; der Spec-Commit gehört zum Lauf.
      - spec-review-orchestrator
    - - '"Scope ist Pflicht, ich frage nach der Nummer."'
      - Ohne Workitem-Nr. kein Scope und keine Frage.
      - spec-review-orchestrator
    - - '"Den Bericht stelle ich selbst zusammen."'
      - Nur `orchestrator-report.js`, unverändert.
      - alle drei
    - - '"Noch eine Followup-Runde."'
      - Das Maximum aus dem Abschnitt Followup-Runden gilt.
      - alle drei
    - - '"Die 🟡 arbeite ich noch ein, dann ist es sauber."'
      - Welche 🔴, 🟡 und 🟢 eine Runde bekommen, entscheidet `auto` über die Empfehlungs-Schwelle; die übrigen stehen im Bericht.
      - alle drei
    - - '"Plan bereit, ich committe."'
      - Nie; der Plan bleibt uncommittet.
      - plan-orchestrator
    - - '"Die Spec-Änderung ist harmlos."'
      - Stopp, Diff zeigen, fragen.
      - plan-orchestrator, implementation-orchestrator
    - - '"Alles grün, `finish-work` gleich mit."'
      - Nie; `finish-work` gehört zur Abschluss-Etappe.
      - implementation-orchestrator
    - - '"Für den PR pushen."'
      - Nie.
      - implementation-orchestrator
