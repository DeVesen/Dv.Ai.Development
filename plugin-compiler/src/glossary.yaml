# Ein Begriff, eine Definition. Fachbegriffe in Quelltexten stehen als [[Begriff]] oder [[Begriff|Anzeigeform]].
# `avoid` listet Wörter, die im Quelltext und in der Ausgabe nicht vorkommen dürfen (wie CONTEXT.md „Nicht verwenden“).
terms:
  - term: Etappe
    definition: 'Ein Schritt der Session-Kette mit eigener Session und festem Modell: Whiteboarding, Grill, Spec-Review, Spec-Nacharbeit, Planning, Plan-Review, Plan-Nacharbeit, Umsetzung, Abschluss. Nicht die Stufe eines Ketten-Eintrags (`spec`, `plan`, `implementation`).'
    avoid: [Phase, Phasen]
    avoid_context: [Stufe (für Kettenschritte)]
    source: "CONTEXT.md. TODO(CONTEXT.md): Der angular-Prototyp nutzt Etappe für seine fünf Schritte ohne Session-Kette."
  - term: Spec
    definition: Funktionale Beschreibung eines Vorhabens als `spec.md`, WAS statt WIE, mit festen Abschnitten von Kopf bis `## Entscheidungen`.
    source: forge/skills/spec-whiteboarding/references/spec-format.md
  - term: Plan
    definition: Umsetzungsplan `plan.md` aus einer Spec mit exakten Dateien, Interfaces und Test-first-Schritten je Task.
    source: forge/skills/plan-writing/references/plan-format.md
  - term: Task
    definition: "Kleinste Einheit des Plans mit eigenem Testzyklus, die einen eigenen Review wert ist; Überschrift `### Task <n>: <Komponente>`."
    source: forge/skills/plan-writing/references/task-rules.md
  - term: Umsetzer
    definition: Wer den Plan Task für Task umsetzt; beherrscht sein Handwerk, hat aber null Kontext zu Projekt, Werkzeugen und Fachgebiet.
    source: forge/skills/plan-writing/SKILL.md (Leitbild)
  - term: Akzeptanzkriterium
    definition: Prüfbare Aussage der Spec in der Form `- **AC-<NN>** Gegeben …, wenn …, dann …`; kurz AC.
    source: forge/skills/spec-whiteboarding/references/ac-rules.md
  - term: W-Eintrag
    definition: Bindende Entscheidung des Menschen unter `## Entscheidungen`, Form `- **W · <Kurztitel>** · <Beleg-Tag> — <Antwort>`.
    source: forge/skills/spec-whiteboarding/references/spec-format.md (Regel 2)
  - term: Beleg-Tag
    definition: Herkunft einer Zeile oder Empfehlung, `Aussage`, `Anhang`, `Historie`, `Git` oder `ungeklärt`; eine Spec der Art `frei` kennt nur `Aussage`, `Anhang` und `ungeklärt`, der Plan zusätzlich `delegiert`.
    source: forge/skills/spec-whiteboarding/references/spec-format.md (Regel 5); forge/skills/plan-writing/references/plan-format.md (Regel 12)
  - term: Frontier
    definition: Alle offenen Entscheidungen, deren Voraussetzungen geklärt sind.
    source: forge/skills/spec-whiteboarding/references/grill-rounds.md (Frontier-Regeln 1)
  - term: Grill-Runde
    definition: Eine Nachricht mit der kompletten Frontier, auf die der Mensch frei in Text antwortet.
    source: forge/skills/spec-whiteboarding/references/grill-rounds.md
  - term: Abbruch
    definition: Ende der Grill-Runden durch die zweite, informierte Ablehnung des Menschen; offene Punkte stehen dann im Abbruch-Abschnitt der Spec.
    source: forge/skills/spec-whiteboarding/references/grill-rounds.md (Abbruch-Regel)
  - term: Reviewer
    definition: Sub-Agent, der ein Artefakt in frischem Kontext prüft und Findings meldet, ohne es zu ändern.
    source: forge/shared/review-flow/flow.md; forge/agents/spec-review-*.md
  - term: Finding
    definition: Befund eines Reviewers an genau einer Stelle, mit wörtlichem Zitat, Kategorie, Konsequenz und Begründung.
    source: forge/shared/review-loop/finding-format.md
  - term: Severity
    definition: Schweregrad eines Findings, 🔴 red blockt, 🟡 yellow ist eine echte Schwäche ohne zwingend falschen Bau, 🟢 green ist eine Anmerkung.
    source: forge/shared/review-loop/severity-rules.md
  - term: Verdict
    definition: "Gesamturteil eines Reviews: `APPROVE`, wenn kein 🔴 offen ist, sonst `NEEDS_CHANGES`. TODO(forge/shared/review-loop/severity-rules.md): forge kennt nur „sauber“ (`clean=true`); die Namen APPROVE und NEEDS_CHANGES stammen aus dem Auftrag."
    source: forge/shared/review-loop/severity-rules.md (Sauber)
  - term: Gate
    definition: Mechanische Prüfung beim Start einer Etappe, ob ihre Pflichtartefakte vorliegen; kein Haltepunkt und keine Entscheidung des Menschen.
    source: "Auftrag; abgegrenzt von CONTEXT.md (Haltepunkt, „Nicht verwenden: Gate“)"
  - term: Pflichtartefakt
    definition: Datei, die eine Etappe als Eingang braucht und die eine Vorgänger-Etappe erzeugt.
    source: Auftrag; forge/skills/plan-writing/SKILL.md (Schritt 1)
  - term: Global Constraints
    definition: Abschnitt des Plans mit jeder projektweiten Vorgabe der Spec, wörtlich, und den Kernregeln der Planungs-Skills; jeder Task erbt ihn.
    source: forge/skills/plan-writing/references/plan-format.md (Regel 2)
  - term: Planungs-Skill
    definition: Skill, dessen Kernregeln das Plan-Writing unter Global Constraints übernimmt; in dv-forge aus `forge-config.js get Planungs-Skills`, hier aus dem Profil des Plugins.
    source: forge/skills/plan-writing/references/context-reading.md (Planungs-Skills)

  # --- Begriffe von dv-forge, wörtlich aus CONTEXT.md (Repo-Wurzel). avoid wird mechanisch geprüft,
  # avoid_context braucht Urteil (Bedeutung hängt vom Satz ab) und wird nur dokumentiert.
  - term: Ketten-Eintrag
    definition: Vermerk je Slug, welcher Orchestrator zuletzt Spec, Plan oder Umsetzung erzeugt oder geprüft hat, mit dessen Werten (Spec, Plan, Workitem, Worktree, Branch). Spätere Berichte zu diesem Slug empfehlen daraus den nächsten Orchestrator-Schritt.
    avoid_context: [Kette (allein für den Vermerk)]
    source: CONTEXT.md
  - term: Followup-Runde
    # Befund 1: CONTEXT.md sagte „höchstens zwei“, die Regeldatei und der Code sagen 8. Die Zahl steht nur noch in der Regeldatei.
    definition: Ein `review-followup`-Lauf innerhalb einer Review-Schleife oder eines Orchestrator-Laufs; je Lauf höchstens so viele, wie `shared/orchestrator-rules.md` unter Maximum Followup-Runden festlegt.
    avoid: [zweiter Followup, Nachrunde]
    source: CONTEXT.md
  - term: Review-Schleife
    definition: 'Ablauf einer Review-Etappe (Spec-Review, Plan-Review): ein Review, danach so viele Followup-Runden, wie das Review anbietet, höchstens bis zum Maximum aus `shared/orchestrator-rules.md`, bis zum Ende der Etappe.'
    avoid: [Zwischenebene, Review-Loop, Review-Lauf]
    source: CONTEXT.md
  - term: Session-Kette
    definition: Lauf von der Idee bis zum gepushten Feature-Branch, in dem jede Etappe in einer eigenen Session läuft und eine Leit-Session sie verbindet.
    avoid: [Orchestrator-Kette]
    avoid_context: [Kette (allein)]
    source: CONTEXT.md
  - term: Ketten-Stand
    definition: 'Einziger dauerhafter Stand einer Session-Kette je Slug: Etappen mit Ergebnis, Hashes und Commits, offene Punkte, Haltepunkt und Freigabe, Ablage der Etappen-Fakten. Die Leit-Session schreibt ihn; er löst den Ketten-Eintrag ab.'
    avoid: [Session-Kette-Stand]
    avoid_context: [Kette (allein), Zustand]
    source: CONTEXT.md
  - term: Etappen-Session
    definition: Session, in der genau eine Etappe läuft; sie meldet sich über ihr Turn-Ende bei der Leit-Session, ein `final` zusätzlich per Nachricht an die Leit-Session.
    avoid: [Kind-Session, Stufen-Session]
    source: CONTEXT.md
  - term: Leit-Session
    definition: 'Session, die eine Session-Kette führt: Etappen-Sessions anstoßen, ihre Ergebnisse gegen git prüfen, an Haltepunkten die Entscheidung des Menschen einholen.'
    avoid: [Haupt-Session, Orchestrator-Session]
    source: CONTEXT.md
  - term: Einstieg
    definition: Etappe, mit der eine Session-Kette beginnt, gewählt per Codewort beim Aufruf; ohne Codewort ist es das Whiteboarding.
    avoid: [Einstiegspunkt]
    source: CONTEXT.md
  - term: Startbefehl
    definition: Der Befehl `/dv-forge:session-orchestrator`, mit dem ein Mensch dv-forge betritt; der einzige Befehl für die Kette, auch mit fertiger Spec oder fertigem Plan.
    avoid_context: [Einstieg (für den Befehl)]
    source: CONTEXT.md
  - term: Unter-Skill
    definition: Skill, den nur eine Etappe oder die Leit-Session startet. Von Hand getippt wird er ohne Debug-Schalter abgelehnt. Werkzeuge ohne Etappe (`init`, `commit-message`, `domain-modeling`, `merge-conflict-resolution`) sind keine Unter-Skills.
    avoid: [interner Skill, Stufen-Skill]
    source: CONTEXT.md
  - term: Debug-Schalter
    definition: Argument `--debug`, mit dem ein Mensch einen Unter-Skill von Hand startet; der Lauf entspricht dem Normallauf, ohne Garantie für den Normalweg.
    avoid: [Notausgang-Flag]
    source: CONTEXT.md
  - term: Haltepunkt
    definition: Fest eingeplante Stelle der Session-Kette, an der die Leit-Session wartet, bis der Mensch entscheidet, wie es weitergeht.
    avoid_context: [Gate (für die Entscheidung des Menschen), Pause]
    source: CONTEXT.md
