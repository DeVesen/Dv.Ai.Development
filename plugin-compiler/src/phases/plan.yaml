id: plan
title: Plan
after: [spec-review]
description: >-
  Turns a reviewed spec.md into an implementation plan with exact files, interfaces and test-first steps before any
  code is written. Use when the spec review is done and the plan is still missing.
argument_hint: "<spec.md> [ziel.md]"
role: >-
  Du schreibst einen [[Plan]] für einen [[Umsetzer]], der sein Handwerk beherrscht, aber null Kontext zu Projekt,
  Werkzeugen und Fachgebiet hat und dessen Testentwurf du nicht vertrauen darfst. Alles steht im Plan, Dateien, Code,
  Tests, nachzulesende Doku, Prüfung. Kleine Tasks, DRY, YAGNI, TDD, häufige Commits.
source: forge/skills/plan-writing/SKILL.md
inputs: [spec, spec-review-report]
primary_input: spec
outputs: [plan]
gate:
  artifact: plan
  criteria: Plan im Format unten geschrieben; jedes AC in mindestens einem Task; Selbst-Check erledigt.
rules: [R-050, R-040, R-041, R-042, R-043, R-044, R-045, R-014, R-015, R-004]
partials: []
required:
  - >-
    **Spec lesen:** Das erste Argument ist die Spec. Fehlt sie oder der Spec-Review-Bericht daneben, meldest du
    „<Artefakt> nicht gefunden: <pfad>“ und endest. [R-050] Steht im Kopf `Status: Abbruch` oder `abgetrennt`,
    warnst du und lässt den Menschen entscheiden. Zeigt `git status --porcelain -- <spec>` eine Zeile, warnst du, dass
    die Spec nicht committet ist.
  - >-
    **Umfang prüfen:** Beschreibt die Spec mehrere unabhängige Teilsysteme, empfiehlst du einen Plan pro Teilsystem und
    fragst nach. Jeder Plan ergibt für sich lauffähige, testbare Software.
  - >-
    **Ziel festlegen:** das zweite Argument, sonst `plan.md` im Ordner der Spec. Existiert die Datei, fragst du nach. [R-015]
  - >-
    **Kontext lesen:** genau die Spec, die Projekt-`CLAUDE.md`, den betroffenen Code und Dateien, die der Mensch
    ausdrücklich mitgibt. [R-043] Erst verorten, dann alle nötigen Zeilenbereiche in einem parallelen Block lesen.
    Danach listest du jede Datei, die entsteht oder sich ändert, mit ihrer Verantwortung; die Tasks folgen daraus.
  - >-
    **Planungs-Skills:** {{ planning_skills_step }}
  - >-
    **Offene Fragen** stellst du dem Menschen, eine pro Nachricht. [R-044]
  - >-
    **Plan schreiben** im Format unten, mit `**Basis:**` aus `git rev-parse --short HEAD`. [R-040] [R-041] [R-042] [R-045]
  - >-
    **Selbst-Check:** Für jede AC-ID und jede Soll-Vorgabe zeigst du auf den Task, der sie umsetzt; Namen und
    Signaturen heißen in allen Tasks gleich; jede Annahme über Fremd-Code hast du im installierten Paket oder in der
    Doku nachgesehen. Was du findest, korrigierst du sofort.
    TODO(forge/skills/plan-writing/SKILL.md): forge prüft vorher mechanisch mit `plan-tasks.js lint`; das Skript ist nicht Teil des Prototyps.
  - >-
    **Ergebnis:** nur den Plan-Pfad nennen. [R-004]
format: |
  ````markdown
  # <Titel> — Umsetzungsplan

  **Ziel:** <ein Satz>
  **Architektur:** <2–3 Sätze>
  **Tech-Stack:** <Technologien>
  **Spec:** <Pfad zur spec.md, relativ zur Checkout-Wurzel>
  **Basis:** <Commit-Kurzhash beim Schreiben>

  ## Global Constraints
  - <projektweite Vorgabe, Wert wörtlich aus der Spec>

  ---

  ### Task 1: <Komponente>

  **ACs:** AC-01, AC-03

  **Dateien:**
  - Create: `exakter/pfad.ext`
  - Modify: `exakter/pfad.ext:123-145` · `Klasse.methode`
  - Test: `tests/exakter/pfad.ext` · `<Anker>`

  **Interfaces:**
  - Consumes: <exakte Signaturen aus früheren Tasks>
  - Produces: <exakte Namen, Parameter- und Rückgabetypen für spätere Tasks>

  - [ ] **Schritt 1: Fehlschlagenden Test schreiben**
  - [ ] **Schritt 2: Test rot laufen lassen** — Befehl: `<befehl>` — erwartet: FAIL `<testname>`
  - [ ] **Schritt 3: Minimal implementieren**
  - [ ] **Schritt 4: Test grün laufen lassen** — Befehl: `<befehl>` — erwartet: PASS
  - [ ] **Schritt 5: Commit**

  ## Entscheidungen
  - **W · <Kurztitel>** · Aussage | delegiert — <Antwort>
  - **E · <Kurztitel>** · Planer — <Wahl und Grund>
  ````

  - Task-Überschriften lauten exakt `### Task <n>: <Komponente>`, `<n>` lückenlos ab 1, ohne Zusätze wie „3a“.
  - Unter [[Global Constraints]] steht jede projektweite Vorgabe der Spec mit exakt ihrem Wert und je Kernregel eines
    [[Planungs-Skill|Planungs-Skills]] eine Zeile mit dem Skill-Namen. Jeder Task erbt diesen Abschnitt.
  - Neue Testdateien stehen als `Create:`; `Test:` steht für eine bestehende Testdatei und trägt einen Anker.
  - Gab es keine Frage an den Menschen, steht unter `## Entscheidungen` die Zeile `- Keine Fragen an den Menschen.`
    TODO(forge/skills/plan-writing/references/plan-format.md): Der Tag `Planer` der E-Einträge steht in keiner Liste der Beleg-Tags (INVENTORY a8).
examples:
  - title: Absicherungstest für ein AC ohne Code-Änderung
    source: forge/skills/plan-writing/references/plan-format.md
    body: |
      ```markdown
      - [ ] **Schritt 1: Absicherungstest schreiben oder bestehenden nennen**
        <vollständiger Testcode oder Testname>
      - [ ] **Schritt 2: Absicherungstest laufen lassen**
        Befehl: `<befehl oder Tool-Aufruf>` — erwartet: PASS `<testname>`; rot ist ein Befund, kein Grund, Code zu ändern
      - [ ] **Schritt 3: Commit** (entfällt, wenn nur ein bestehender Test lief)
      ```
  - title: Rote Flaggen beim Planen
    source: forge/skills/plan-writing/SKILL.md (Rote Flaggen)
    body: |
      | Gedanke | Stattdessen |
      |---|---|
      | „Ein kurzer Plan ohne Code reicht.“ | Der Umsetzer hat null Kontext. Jeder Code-Schritt enthält vollständigen Code. |
      | „Der alte Plan zum Thema hilft.“ | Andere Specs und Pläne liest du nie; sie lenken einen Neuanlauf. |
      | „Wie Task 3, nur anders.“ | Code wiederholen; Tasks werden womöglich außer der Reihe gelesen. |
      | „Tests kommen am Ende.“ | Jeder Task beginnt mit einem fehlschlagenden Test. |
      | „Zeilennummern reichen.“ | `Modify` braucht einen stabilen Anker. |
