# Vollständiges dv-forge aus src/forge. Prosa wortgleich zum Bestand (geprüft in der Stufe „Äquivalenz“),
# Regeln, Etappen und Hooks als Daten, Code als Assets.
name: dv-forge
dir: forge
version: 0.35.0
description: Spezifizieren, Planen und Umsetzen mit orchestrierten Review-Loops
source: src/forge
# forge-Besonderheiten, die früher im Compiler-Code standen:
intern_zusatz: "Gilt als intern und ist Teil der Session-Kette; Start nur über /dv-forge:session-orchestrator."
etappen_abgleich: session-chain
equivalent_to: ../plugins/forge
# Jede Abweichung vom Bestand steht mit Befund-Nummer im Änderungsprotokoll; sonst bricht der Build ab.
changelog: src/forge/CHANGES.yaml
author: DeVesen
# Bewusste Abweichungen vom Bestand, die die Äquivalenzprüfung zulässt (Datei#Schlüssel in JSON).
equivalence_ignore:
  - .claude-plugin/plugin.json#author   # claude plugin validate --strict verlangt author; der Bestand hat keinen
assets:
  # Code ist keine Prosa: Skripte, Tests und Golden-Sets liegen als Assets unter src/forge/assets und werden unverändert kopiert.
  - {from: src/forge/assets/scripts, to: scripts}
  - {from: src/forge/assets/tests, to: tests}
  - {from: src/forge/assets/evals, to: evals}
hooks:
  UserPromptSubmit:
    - commands: [guard-orchestrator.js prompt, stage-guard.js prompt]
  PreToolUse:
    - matcher: Read|Edit|Write|MultiEdit|NotebookEdit|Grep|Bash|PowerShell|Skill|Agent
      commands: [guard-orchestrator.js pretool]
    - matcher: mcp__ccd_session__start_session
      commands: [start-guard.js]
  Stop:
    - commands: [guard-orchestrator.js turn-end, stage-guard.js turn-end]
  SessionEnd:
    - commands: [guard-orchestrator.js stop, stage-guard.js stop]
  SubagentStop:
    - commands: [result-check.js, agent-check.js]
